backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

site_url: https://hemoh.netlify.app
display_url: https://hemoh.netlify.app

collections:
  - name: "projects"
    label: "Portfolio Projects"
    label_singular: "Project"
    files:
      - name: "projects"
        label: "All Projects"
        file: "content/projects.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "string"
                hint: "Type any category you want (e.g. Thumbnail, Logo, Branding, Illustration). This becomes a filter tab on the site automatically."
              - { label: "Cover Image", name: "image", widget: "image", hint: "This is the main image shown in the grid." }
              - label: "Extra Gallery Images (optional)"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "Image", name: "src", widget: "image" }
                hint: "Add more images here if you want people to see multiple shots when they click this project. The cover image above is always shown first."
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "Site Content"
        file: "content/settings.json"
        fields:
          - { label: "Hero Eyebrow Text", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero Title (line 1)", name: "hero_title_line1", widget: "string" }
          - { label: "Hero Title (accent line, orange)", name: "hero_title_accent", widget: "string" }
          - { label: "Hero Subtext", name: "hero_subtext", widget: "text" }
          - { label: "Stat — Disciplines (number)", name: "hero_stat_disciplines", widget: "string" }
          - { label: "Stat — Availability", name: "hero_stat_availability", widget: "string" }
          - { label: "Hero Background Photo (optional — leave empty to keep the plain dark background)", name: "hero_background_image", widget: "image", required: false }
          - { label: "About Text", name: "about_text", widget: "text" }
          - label: "Skills"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
          - { label: "Contact Text", name: "contact_text", widget: "text" }
          - label: "Contact Links"
            name: "contact_links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
